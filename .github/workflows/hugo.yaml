name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 允许 workflow 向 GitHub Pages 部署，并用 id-token 验证部署来源
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署；排队中的部署不取消进行中的那次
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与本地保持一致，避免主题与新版 Hugo 的兼容问题
      HUGO_VERSION: 0.166.0
      HUGO_ENVIRONMENT: production
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 取完整历史，页面「更新于」时间与 :git 取 lastmod 依赖它
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          wget -q -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      # 主题通过 Hugo Modules 引入，需要 Go
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
